{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdeaPartnerHub — Startup Studio</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'Style.css' %}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body.ninora-theme {
      font-family: 'Instrument Sans', sans-serif !important;
      background-color: #ffffff !important;
      color: #0f172a !important;
      line-height: 1.6;
    }
    h1, h2, h3, h4 { font-family: 'Bricolage Grotesque', sans-serif !important; }

    /* Dark Gradient Hero */
    .hero-wrapper {
      background: radial-gradient(circle at 80% 20%, #3b2d8b 0%, #17153b 45%, #0b0a1f 100%) !important;
      color: #ffffff !important;
      padding-bottom: 5rem;
      overflow: hidden;
    }

    /* Navbar */
    .n-nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.4rem 24px;
      display: flex !important;
      justify-content: space-between;
      align-items: center;
    }
    .n-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #ffffff !important;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .n-logo img { height: 36px; border-radius: 6px; }
    .n-links { display: flex !important; align-items: center; gap: 1.8rem; }
    .n-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .n-links a:hover { color: #ffffff; }

    .n-btn {
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      display: inline-flex !important;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }
    .n-btn:hover { transform: translateY(-2px); }
    .n-btn-white { background: #ffffff !important; color: #0f172a !important; }
    .n-btn-glass {
      background: rgba(255, 255, 255, 0.12) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
    }
    .n-btn-danger { background: #ef4444 !important; color: #ffffff !important; }

    /* Hero Grid */
    .n-hero {
      max-width: 1200px;
      margin: 3rem auto 0;
      padding: 0 24px;
      display: grid !important;
      grid-template-columns: 1.15fr 1fr !important;
      gap: 3.5rem;
      align-items: center;
    }
    .n-eyebrow {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 1rem;
      display: block;
    }
    .n-hero h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 1.3rem;
      color: #ffffff !important;
    }
    .n-hero p {
      color: #cbd5e1;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      max-width: 500px;
    }
    .n-pills { display: flex !important; flex-wrap: wrap; gap: 0.85rem; margin-bottom: 1.5rem; }
    .n-sub-link { color: #a5b4fc; text-decoration: none; font-size: 0.95rem; font-weight: 600; }
    .n-sub-link:hover { text-decoration: underline; }

    /* Right Floating Cards */
    .n-showcase {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 1rem;
      transform: rotate(-3deg);
    }
    .n-mock-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 1.3rem;
      color: #ffffff;
    }
    .n-mock-card.light { background: #ffffff; color: #0f172a; }
    .n-mock-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: #4f46e5;
      color: #ffffff;
      display: inline-block;
      margin-bottom: 0.6rem;
    }
    .n-mock-card h4 { font-size: 1.05rem; margin-bottom: 0.4rem; }
    .n-mock-card p { font-size: 0.82rem; opacity: 0.85; margin: 0; }

    /* White Section & 3-Column Steps */
    .n-white-sec { max-width: 1200px; margin: 4.5rem auto; padding: 0 24px; }
    .n-split {
      display: grid !important;
      grid-template-columns: 1fr 1.4fr !important;
      gap: 3rem;
      align-items: start;
      margin-bottom: 3.5rem;
    }
    .n-split small { text-transform: uppercase; letter-spacing: 1.5px; color: #6366f1; font-weight: 700; font-size: 0.8rem; }
    .n-split h2 { font-size: 2.3rem; margin-top: 0.4rem; }
    .n-split p { color: #475569; font-size: 1.05rem; margin-bottom: 1.5rem; }

    .n-grid-3 {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 1.5rem !important;
    }
    .n-feat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.8rem;
    }
    .n-feat-card h3 { margin: 0.6rem 0; font-size: 1.25rem; }
    .n-feat-card p { color: #475569; font-size: 0.95rem; }

    /* Interactive How It Works Tabs (Side-by-Side) */
    .iph-extra-wrap { max-width: 1200px; margin: 4rem auto 5rem; padding: 0 24px; }
    .iph-sec-head { text-align: center; max-width: 650px; margin: 0 auto 2.2rem; }
    .iph-sec-head small { text-transform: uppercase; letter-spacing: 1.5px; color: #4f46e5; font-weight: 700; font-size: 0.8rem; }
    .iph-sec-head h2 { font-size: 2.2rem; margin: 0.4rem 0 0.5rem; }
    .iph-sec-head p { color: #475569; font-size: 1rem; }

    .iph-tabs-nav {
      display: flex !important;
      flex-direction: row !important;
      justify-content: center !important;
      flex-wrap: wrap !important;
      gap: 12px !important;
      margin-bottom: 2rem !important;
    }
    .iph-tab-btn {
      padding: 0.72rem 1.3rem !important;
      border-radius: 999px !important;
      border: 1.5px solid #cbd5e1 !important;
      background: #ffffff !important;
      color: #334155 !important;
      font-weight: 600 !important;
      font-size: 0.92rem !important;
      cursor: pointer !important;
      width: auto !important;
      display: inline-flex !important;
      align-items: center !important;
    }
    .iph-tab-btn.active {
      background: #17153b !important;
      color: #ffffff !important;
      border-color: #17153b !important;
    }

    .iph-tab-panel {
      display: none !important;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      padding: 2.4rem;
      grid-template-columns: 1.25fr 1fr !important;
      gap: 2.5rem;
      align-items: center;
    }
    .iph-tab-panel.active { display: grid !important; }
    .iph-panel-left h3 { font-size: 1.7rem; margin-bottom: 0.7rem; }
    .iph-panel-left p { color: #475569; margin-bottom: 1.2rem; }
    .iph-step-list { list-style: none; margin-bottom: 1.6rem; }
    .iph-step-list li {
      margin-bottom: 0.6rem;
      color: #1e293b;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .iph-step-list li span {
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 700;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .iph-panel-card {
      background: linear-gradient(135deg, #17153b 0%, #3b2d8b 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 2rem;
    }
    .iph-panel-card .badge {
      background: rgba(255, 255, 255, 0.16);
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 0.9rem;
    }
    .iph-panel-card h4 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    .iph-panel-card p { color: #cbd5e1; font-size: 0.92rem; }

    /* Footer */
    .n-footer {
      background: #0b0a1f;
      color: #94a3b8;
      padding: 2.5rem 24px;
      text-align: center;
      font-size: 0.9rem;
    }

    @media (max-width: 850px) {
      .n-hero, .n-split, .n-grid-3, .iph-tab-panel.active { grid-template-columns: 1fr !important; }
      .n-hero h1 { font-size: 2.4rem; }
      .n-showcase { transform: none; }
      .n-links a:not(.n-btn) { display: none; }
    }
  </style>
</head>
<body class="ninora-theme">

  <!-- Dark Hero Section -->
  <div class="hero-wrapper">
    <nav class="n-nav">
      <a href="{% url 'home' %}" class="n-logo">
        <img src="{% static 'images/logo.png' %}" alt="Logo">
        <span>IdeaPartnerHub</span>
      </a>

      <div class="n-links">
        <a href="#how-it-works">How it works</a>
        <a href="#live-ideas">Explore Ideas</a>
        <a href="{% url 'find_team_register' %}">Find Teammates</a>

        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}" class="n-btn n-btn-white">Dashboard</a>
          <form method="post" action="{% url 'logout' %}" style="margin:0;">
            {% csrf_token %}
            <button type="submit" class="n-btn n-btn-danger">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="n-btn n-btn-glass">Log in</a>
          <a href="{% url 'signup' %}" class="n-btn n-btn-white">Sign up</a>
        {% endif %}
      </div>
    </nav>

    {% if messages %}
      <div style="max-width:1200px; margin:0 auto; padding:0 24px;">
        {% for message in messages %}
          <p style="background:rgba(255,255,255,0.15); padding:10px 16px; border-radius:8px; margin-bottom:10px;">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <div class="n-hero">
      <div>
